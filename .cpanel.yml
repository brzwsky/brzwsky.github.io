deployment:
  tasks:
    - export DEPLOYPATH=/home/topjeuco/public_html/

    # Core pages
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp -R ca $DEPLOYPATH

    # Assets & config
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp sitemap.xml $DEPLOYPATH
    - /bin/cp site.webmanifest $DEPLOYPATH

    # Scripts & styles (minified)
    - /bin/cp app.minified.js $DEPLOYPATH/app.minified.js
    - /bin/cp style.minified.css $DEPLOYPATH/style.minified.css
    - /bin/cp favicon.ico $DEPLOYPATH

    # Reviews section
    - /bin/cp -R reviews $DEPLOYPATH/reviews/
